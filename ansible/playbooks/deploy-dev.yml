- hosts: dev
  tasks:
    - name: Met à jour apt-get avant tout
      apt:
        update_cache: yes

    - name: Installe python3.8 (version moderne)
      apt:
        name: python3.8
        state: present

    - name: Force le lien symbolique python3 vers python3.8
      ansible.builtin.command:
        cmd: update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.8 1
      become: yes
      ignore_errors: yes
      
    - name: Installer les dépendances
      apt:
        name: [git, python3, nginx]
        state: present
        update_cache: yes
    - name: Cloner le dépôt
      git:
        repo: "https://github.com/jamesdeoliveira78/projet.git"
        dest: /opt/app
    - name: Lancer l app
      shell: python3 /opt/app/app.py > /var/log/app.log 2>&1 &
